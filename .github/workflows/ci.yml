name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig build fmt-check

      - name: Run unit tests and documentation checks
        run: zig build test

      - name: Run native validation
        if: runner.os == 'Linux'
        run: zig build validate

      - name: Cross-target compile checks
        if: runner.os == 'Linux'
        run: zig build crosscheck

      - name: WASI runtime checks
        if: runner.os == 'Linux'
        run: zig build test-wasi
